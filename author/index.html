<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <!-- The studio frames the player for live preview, hence frame-src 'self'. -->
  <meta http-equiv="Content-Security-Policy" content="
    default-src 'self';
    script-src 'self';
    style-src 'self' 'unsafe-inline';
    font-src 'self';
    img-src 'self' data:;
    connect-src 'self';
    frame-src 'self';
    manifest-src 'self';
    object-src 'none';
    base-uri 'none';
    form-action 'none'">
  <title>Escape Room Authoring Studio</title>
  <link rel="manifest" href="/manifest.webmanifest">
  <link rel="stylesheet" href="/fonts/fonts.css">
  <style>
    :root {
      --bg-dark: #0a0e17;
      --bg-card: #141c2b;
      --bg-input: #1a2538;
      --accent: #00ff88;
      --accent-dim: #00b35f;
      --text: #e2e8f0;
      --text-dim: #94a3b8;
      --border: #233148;
      --red: #ff4d67;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      background: var(--bg-dark);
      color: var(--text);
      font-family: 'Jost', sans-serif;
      min-height: 100vh;
    }
  </style>
</head>
<body>
  <div id="root"></div>
  <script type="module" src="/src/editor/main.tsx"></script>
</body>
</html>
