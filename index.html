<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <!--
    Defence in depth for imported quiz JSON. Author text is escaped by React and
    room artwork is sanitised before it reaches dangerouslySetInnerHTML; this caps
    the damage if either is bypassed.
    script-src has NO 'unsafe-inline'.
    style-src still needs 'unsafe-inline' because the design leans on inline
    style attributes, which cannot be nonce'd.
    frame-src 'self' is required by the author studio's live preview, which frames
    the /preview route.
    Fonts are self-hosted (public/fonts/), so no external origin is allowed at all.
    frame-ancestors is intentionally absent: it is ignored in a <meta> CSP and
    must be sent as a real header by the host.
  -->
  <meta http-equiv="Content-Security-Policy" content="
    default-src 'self';
    script-src 'self';
    style-src 'self' 'unsafe-inline';
    font-src 'self';
    img-src 'self' data: https: blob:;
    connect-src 'self' https:;
    frame-src 'self';
    manifest-src 'self';
    object-src 'none';
    base-uri 'none';
    form-action 'none'">
  <title>Escape Room</title>
  <meta name="description"
    content="Dynamic browser-based educational escape rooms, with an authoring studio.">
  <link rel="icon" type="image/svg+xml"
    href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='6' fill='%231b1917'/%3E%3Cg fill='none' stroke='%2358c98d' stroke-width='2.2' stroke-linecap='round'%3E%3Crect x='9' y='14.5' width='14' height='10' rx='2'/%3E%3Cpath d='M12.5 14.5V11a3.5 3.5 0 0 1 7 0v3.5'/%3E%3C/g%3E%3C/svg%3E">
  <link rel="stylesheet" href="fonts/fonts.css">
  <link rel="manifest" href="manifest.webmanifest">
  <script>
    // Single Page Apps for GitHub Pages URL decoder
    (function(l) {
      if (l.search && l.search[1] === 'p') {
        var decoded = l.search.slice(1).split('&').map(function(s) {
          return s.replace(/~and~/g, '&');
        }).filter(function(s) {
          return s.slice(0, 2) === 'p=';
        })[0];
        if (decoded) {
          var routePath = decoded.slice(2);
          var q = l.search.slice(1).split('&').filter(function(s) {
            return s.slice(0, 2) === 'q=';
          })[0];
          var searchStr = q ? '?' + q.slice(2).replace(/~and~/g, '&') : '';
          window.history.replaceState(null, null,
            l.pathname.slice(0, -1) + routePath + searchStr + l.hash
          );
        }
      }
    }(window.location));
  </script>
</head>

<body>
  <!--
    Single mount point for the whole SPA: the player, the quiz picker, and the
    authoring studio are all routes declared in src/router.tsx. The game's markup
    used to live here as static HTML that src/engine/main.ts mutated by id.
  -->
  <div id="root"></div>
  <script type="module" src="/src/main.tsx"></script>
</body>

</html>
