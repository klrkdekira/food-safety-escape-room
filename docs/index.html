<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <!--
    Defence in depth for imported quiz JSON. Author text is escaped by React and
    room image URLs are constrained to site-local or HTTPS sources by the quiz
    schema. Rich prose is sanitised before it reaches dangerouslySetInnerHTML.
    script-src has NO 'unsafe-inline'.
    style-src still needs 'unsafe-inline' because the design leans on inline
    style attributes, which cannot be nonce'd.
    frame-src 'self' is required by the author studio's live preview, which frames
    the /preview route.
    Fonts are self-hosted (`public/fonts/`). HTTPS remains permitted only for optional author-selected Creative Commons artwork and the studio's Commons search; it is not a runtime library dependency.
    frame-ancestors is intentionally absent: it is ignored in a <meta> CSP and
    must be sent as a real header by the host.
  -->
  <meta http-equiv="Content-Security-Policy" content="
    default-src 'self';
    script-src 'self';
    style-src 'self' 'unsafe-inline';
    font-src 'self';
    img-src 'self' data: https: blob:;
    connect-src 'self' https:;
    frame-src 'self';
    manifest-src 'self';
    object-src 'none';
    base-uri 'none';
    form-action 'none'">
  <title>Escape Room</title>
  <meta name="description"
    content="Dynamic browser-based educational escape rooms, with an authoring studio.">
  <link rel="icon" type="image/svg+xml"
    href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='6' fill='%231b1917'/%3E%3Cg fill='none' stroke='%2358c98d' stroke-width='2.2' stroke-linecap='round'%3E%3Crect x='9' y='14.5' width='14' height='10' rx='2'/%3E%3Cpath d='M12.5 14.5V11a3.5 3.5 0 0 1 7 0v3.5'/%3E%3C/g%3E%3C/svg%3E">
  <link rel="stylesheet" href="fonts/fonts.css">
  <link rel="manifest" href="manifest.webmanifest">
  <script src="/route-recovery.js"></script>
  <script type="module" crossorigin src="/assets/index-CHwRd4B2.js"></script>
  <link rel="modulepreload" crossorigin href="/assets/rolldown-runtime-CbXtAM7H.js">
  <link rel="modulepreload" crossorigin href="/assets/useRouteContext-BFIaaLr0.js">
  <link rel="modulepreload" crossorigin href="/assets/Match-DRglHVFD.js">
  <link rel="stylesheet" crossorigin href="/assets/index-Dt862Nlr.css">
</head>

<body>
  <!--
    Single mount point for the whole SPA: the player, the quiz picker, and the
    authoring studio are all routes declared in src/router.tsx. The game's markup
    used to live here as static HTML that src/engine/main.ts mutated by id.
  -->
  <div id="root"></div>
</body>

</html>
