      </div>
      <div id="hud-buttons">
        <button type="button" class="hud-btn" id="btn-debug" data-action="debug-next" style="display:none; color:var(--red); border-color:var(--red);">DEV NEXT</button>
        <button type="button" class="hud-btn" id="btn-hint" data-action="hud-hint">HINT</button>
        <button type="button" class="hud-btn" id="btn-sound" data-action="hud-sound">SOUND ON</button>
        <button type="button" class="hud-btn" id="btn-save" data-action="hud-save">SAVE</button>
      </div>
    </div>

    <div id="rooms-container"></div>

    <div id="final-code-panel" class="screen">
      <div class="final-code-panel">
        <h3 id="final-escape-title">FINAL OVERRIDE</h3>
        <p id="final-escape-text" style="color:var(--text-secondary);margin-bottom:20px;line-height:1.6">
        </p>
        <div id="final-code-content"></div>
      </div>
    </div>
  </div>

  <!-- ===== VICTORY ===== -->
  <div id="victory-screen" class="screen">
    <div class="victory-title" id="victory-title"></div>
    <div class="victory-subtitle" id="victory-subtitle"></div>
    <div class="victory-rank" id="victory-rank">S</div>
    <div class="victory-stats">
      <div class="victory-stat">
        <div class="victory-stat-label">FINAL SCORE</div>
        <div class="victory-stat-value" id="victory-score">0</div>
      </div>
      <div class="victory-stat">
        <div class="victory-stat-label">TIME ELAPSED</div>
        <div class="victory-stat-value" id="victory-time">00:00</div>
      </div>
      <div class="victory-stat">
        <div class="victory-stat-label">PUZZLES SOLVED</div>
        <div class="victory-stat-value" id="victory-puzzles">0</div>
      </div>
    </div>
    <p id="victory-text" style="color:var(--text-secondary);max-width:500px;line-height:1.6">
    </p>
    <button type="button" class="btn-primary" data-action="play-again" style="margin-top:20px">PLAY AGAIN</button>
    <button type="button" class="btn-secondary" data-action="export-result" style="margin-top:20px;margin-left:10px;">EXPORT RESULT</button>
  </div>

  <div id="version-display"
    style="position:fixed; bottom:5px; right:10px; font-family:var(--font-mono); font-size:12px; color:var(--text-dim); opacity:0.6; pointer-events:none; z-index:9999;">
  </div>

</body>

</html>
